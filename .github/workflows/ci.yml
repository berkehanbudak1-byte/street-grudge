name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax checks
        run: |
          for f in src/*.js tests/*.js tests/*.mjs; do node --check "$f"; done
          bash -n OYUNU_BASLAT.command

      - name: Run unit and smoke tests
        run: node --test tests/security.test.js tests/smoke.test.mjs
